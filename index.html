<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Aktiehandel</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Import axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
</head>

<body>
    <div id="app">
        <div class="container py-5">
            <div class="row justify-content-center">
                <section class="col-lg-9">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h1 class="card-title mb-3">{{ intro }}</h1>
                            <p class="text-muted">jep jep</p>
                            <!-- Add input field for search -->


                            <!-- Table of aktiehandel -->
                            <div class="table-responsive">
                                <table class="table table-striped table-hover mb-0">
                                    <thead class="thead-dark">
                                        <tr>
                                            <th>ID</th>
                                            <th>Stock</th>
                                            <th>Amount</th>
                                            <th>Price</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="aktieHandel in aktieList" :key="aktieHandel.id">
                                            <th>{{ aktieHandel.id }}</th>
                                            <td>{{ aktieHandel.name }}</td>
                                            <td>{{ aktieHandel.amount }}</td>
                                            <td>{{ aktieHandel.exchangePrice }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>



    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>

</html>
