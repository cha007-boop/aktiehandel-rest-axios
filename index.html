<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Aktiehandel</title>
    <!-- Import Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Import axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
</head>

<body>
    <div id="app">
        <div class="container py-5">
            <div class="row justify-content-center">
                <section class="col-lg-9">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h1 class="card-title mb-3">{{ intro }}</h1>
                            <p class="text-muted">Filtering</p>
                            <!-- Add filter options -->
                            <div class="row mb-3">
                                <div class="col-md-6 mb-3">
                                    <label for="aktieName" class="form-label">Stock Name</label>
                                    <input type="text" id="aktieName" v-model="aktieName" @change="getAll"
                                        class="form-control" placeholder="Enter stock name">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="id" class="form-label">ID</label>
                                    <input type="number" id="id" v-model.number="id" @change="getAll"
                                        class="form-control" placeholder="Enter ID">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="minExchangePrice" class="form-label">Min Exchange Price</label>
                                    <input type="number" id="minExchangePrice" v-model.number="minExchangePrice"
                                        @change="getAll" class="form-control"
                                        placeholder="Enter minimum exchange price">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="maxExchangePrice" class="form-label">Max Exchange Price</label>
                                    <input type="number" id="maxExchangePrice" v-model.number="maxExchangePrice"
                                        @change="getAll" class="form-control"
                                        placeholder="Enter maximum exchange price">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="minAmount" class="form-label">Min Amount</label>
                                    <input type="number" id="minAmount" v-model.number="minAmount" @change="getAll"
                                        class="form-control" placeholder="Enter minimum amount">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="maxAmount" class="form-label">Max Amount</label>
                                    <input type="number" id="maxAmount" v-model.number="maxAmount" @change="getAll"
                                        class="form-control" placeholder="Enter maximum amount">
                                </div>
                            </div>

                            <!-- Table of aktiehandel -->
                            <div class="table-responsive">
                                <table class="table table-striped table-hover mb-0">
                                    <thead class="thead-dark">
                                        <tr>
                                            <!-- Make table headers clickable to sort -->
                                            <th @click="sortByColumn('id')">ID</th>
                                            <th @click="sortByColumn('name')">Name</th>
                                            <th @click="sortByColumn('amount')">Amount</th>
                                            <th @click="sortByColumn('exchangePrice')">Exchange Price</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="aktieHandel in aktieList" :key="aktieHandel.id">
                                            <th>{{ aktieHandel.id }}</th>
                                            <td>{{ aktieHandel.name }}</td>
                                            <td>{{ aktieHandel.amount }}</td>
                                            <td>{{ aktieHandel.exchangePrice }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>



    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>

</html>
